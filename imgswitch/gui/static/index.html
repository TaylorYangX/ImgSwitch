<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImgSwitch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='3'/><circle cx='9' cy='9' r='2'/><path d='m21 15-5-5L5 21'/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .field { @apply block text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-1; }
      .hint { @apply text-xs text-zinc-500 dark:text-zinc-400 mt-1; }
      .input { @apply w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 px-3 py-2 text-sm text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500; }
      .btn-secondary { @apply inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition disabled:opacity-50 disabled:cursor-not-allowed border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200 hover:bg-zinc-50 dark:hover:bg-zinc-800; }
      .chip { @apply rounded-md border px-2 py-1 text-xs font-medium transition; }
      .panel { @apply rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900; }
    }
  </style>
</head>
<body class="min-h-screen bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">
<div id="app"></div>

<script type="text/x-template" id="size-picker">
  <div>
    <div class="flex flex-wrap gap-1.5 mb-2">
      <button v-for="p in presets" :key="p.value" type="button" @click="$emit('update:modelValue', p.value)"
              :class="['chip', modelValue === p.value
                ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300'
                : 'border-zinc-300 dark:border-zinc-700 text-zinc-600 dark:text-zinc-400 hover:border-zinc-400']">
        {{ p.label }}
      </button>
    </div>
    <input class="input font-mono" :value="modelValue" @input="$emit('update:modelValue', $event.target.value.trim())"
           placeholder="1024x1024" spellcheck="false">
  </div>
</script>

<script type="text/x-template" id="app-tpl">
  <div class="mx-auto max-w-5xl px-4 py-8 sm:py-10">
    <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div class="flex items-center gap-3">
        <div class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-600 text-white">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-semibold tracking-tight">ImgSwitch</h1>
          <p class="text-sm text-zinc-500 dark:text-zinc-400">Image generation backend for Claude Code</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm" aria-live="polite">
        <span v-if="saveState === 'saved'" class="text-emerald-600 dark:text-emerald-400">✓ Saved</span>
        <span v-else-if="saveState === 'pending' || saveState === 'saving'" class="text-zinc-500">Saving…</span>
        <span v-else-if="saveState === 'error'" class="text-red-600 dark:text-red-400" :title="saveError">✕ Not saved: {{ saveError }}</span>
      </div>
    </header>

    <div v-if="loadError" class="panel p-6 text-red-600">{{ loadError }}</div>

    <template v-if="cfg">
      <!-- Backend switcher -->
      <section class="mb-8">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1">Backends</h2>
        <p class="hint mb-3">
          Click a card to make it the active backend, which Claude uses by default. Untick <em>Available to Claude</em> to hide a backend
          from Claude entirely; Claude can pick any other available one when you ask for its model.
        </p>
        <div class="grid gap-4 md:grid-cols-4">
          <div v-for="group in groups" :key="group.label" :class="group.span" class="min-w-0">
            <p class="text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-2">{{ group.label }}</p>
            <div :class="['grid gap-3', group.cols]">
              <div v-for="p in group.items" :key="p.id"
                   :class="['panel transition relative w-full min-w-0 flex flex-col',
                     cfg.active_provider === p.id ? 'ring-2 ring-indigo-500 border-transparent' : 'hover:border-zinc-300 dark:hover:border-zinc-700']">
                <button type="button" @click="activate(p.id)"
                        :class="['text-left p-4 pb-3 w-full flex-1', cfg.providers[p.id].enabled ? '' : 'opacity-60']">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <p class="font-medium">{{ p.name }}</p>
                      <p class="text-xs text-zinc-500 dark:text-zinc-400 truncate font-mono mt-0.5">{{ cfg.providers[p.id].base_url }}</p>
                    </div>
                    <span v-if="cfg.active_provider === p.id"
                          class="shrink-0 rounded-full bg-indigo-600 px-2 py-0.5 text-[11px] font-semibold text-white">Active</span>
                  </div>
                  <div class="mt-3 flex items-center gap-2 text-xs">
                    <span :class="['h-2 w-2 shrink-0 rounded-full', dotClass(status[p.id])]"></span>
                    <span class="truncate text-zinc-600 dark:text-zinc-400" :title="status[p.id]?.detail">
                      {{ statusText(status[p.id]) }}
                    </span>
                  </div>
                </button>
                <label :class="['flex items-center gap-2 border-t border-zinc-200 dark:border-zinc-800 px-4 py-2 text-xs text-zinc-600 dark:text-zinc-400',
                         cfg.active_provider === p.id ? 'cursor-not-allowed' : 'cursor-pointer']"
                       :title="cfg.active_provider === p.id ? 'Choose another active backend first' : 'Whether Claude may use this backend'">
                  <input type="checkbox" class="accent-indigo-600" v-model="cfg.providers[p.id].enabled" :disabled="cfg.active_provider === p.id">
                  {{ cfg.providers[p.id].enabled ? 'Available to Claude' : 'Not available to Claude' }}
                </label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Settings -->
      <section class="panel mb-8">
        <div class="flex gap-1 overflow-x-auto border-b border-zinc-200 dark:border-zinc-800 px-2">
          <button v-for="t in tabs" :key="t.id" type="button" @click="tab = t.id"
                  :class="['whitespace-nowrap px-3 py-3 text-sm font-medium border-b-2 -mb-px transition',
                    tab === t.id ? 'border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'border-transparent text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200']">
            {{ t.name }}
          </button>
        </div>

        <div class="p-5 sm:p-6">
          <!-- OpenAI-compatible -->
          <div v-if="tab === 'openai'" class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="field">API base URL</label>
              <input class="input font-mono" v-model.trim="cfg.providers.openai.base_url" placeholder="https://api.openai.com/v1" spellcheck="false">
              <p class="hint">Any endpoint that implements <span class="font-mono">POST /images/generations</span>.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">API key</label>
              <div class="flex gap-2">
                <input class="input font-mono" :type="showKey ? 'text' : 'password'" v-model.trim="cfg.providers.openai.api_key"
                       placeholder="sk-…" autocomplete="off" spellcheck="false" @focus="$event.target.select()">
                <button type="button" class="btn-secondary shrink-0" @click="showKey = !showKey">{{ showKey ? 'Hide' : 'Show' }}</button>
              </div>
              <p class="hint" v-if="meta.api_key_env_var">
                <span class="font-mono">{{ meta.api_key_env_var }}</span> is set in this shell. If Claude Code's environment has it too, it overrides this field.
              </p>
              <p class="hint" v-else>Stored in config.json (file mode 600). Shown masked after saving.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">Model</label>
              <div class="flex gap-2">
                <select class="input font-mono" v-model="modelChoice">
                  <option v-for="m in modelOptions" :key="m" :value="m">{{ m }}</option>
                  <option value="__custom__">Custom model name…</option>
                </select>
                <button type="button" class="btn-secondary shrink-0" @click="loadOpenAIModels" :disabled="modelsLoading || !cfg.providers.openai.api_key">
                  {{ modelsLoading ? 'Loading…' : 'Refresh' }}
                </button>
              </div>
              <input v-if="customModel" class="input font-mono mt-2" v-model.trim="cfg.providers.openai.model" placeholder="model id, e.g. flux-1-schnell" spellcheck="false">
              <p class="hint" :class="modelsError ? 'text-red-600!' : ''">{{ modelsHint }}</p>
            </div>
            <div>
              <label class="field">Response format</label>
              <select class="input" v-model="cfg.providers.openai.response_format" :disabled="isGptImage">
                <option value="b64_json">b64_json (image bytes inline)</option>
                <option value="url">url (download from returned link)</option>
                <option value="omit">omit field (some proxies)</option>
              </select>
              <p class="hint" v-if="isGptImage">gpt-image models always return base64, so this field is not sent.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">Default size</label>
              <size-picker v-model="cfg.providers.openai.default_size" :presets="openaiSizes"></size-picker>
            </div>
            <div>
              <label class="field">Timeout (seconds)</label>
              <input class="input" type="number" min="1" v-model.number="cfg.providers.openai.timeout">
            </div>
          </div>

          <!-- A1111 -->
          <div v-if="tab === 'a1111'" class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="field">WebUI URL</label>
              <input class="input font-mono" v-model.trim="cfg.providers.a1111.base_url" placeholder="http://127.0.0.1:7860" spellcheck="false">
              <p class="hint">Start the WebUI with <span class="font-mono">--api</span> so <span class="font-mono">/sdapi/v1/txt2img</span> is available.</p>
            </div>
            <div>
              <label class="field">Sampling steps: {{ cfg.providers.a1111.steps }}</label>
              <input class="w-full accent-indigo-600" type="range" min="1" max="150" v-model.number="cfg.providers.a1111.steps">
            </div>
            <div>
              <label class="field">CFG scale</label>
              <input class="input" type="number" min="1" max="30" step="0.5" v-model.number="cfg.providers.a1111.cfg_scale">
            </div>
            <div>
              <label class="field">Sampler</label>
              <input class="input" v-model.trim="cfg.providers.a1111.sampler_name" list="a1111-samplers">
              <datalist id="a1111-samplers">
                <option v-for="s in samplers" :key="s" :value="s"></option>
              </datalist>
            </div>
            <div>
              <label class="field">Timeout (seconds)</label>
              <input class="input" type="number" min="1" v-model.number="cfg.providers.a1111.timeout">
            </div>
            <div class="sm:col-span-2">
              <label class="field">Default size</label>
              <div class="flex flex-wrap items-center gap-2 mb-2 text-xs text-zinc-500">
                <span>Base resolution</span>
                <select class="input w-auto! py-1! text-xs" v-model.number="localBase">
                  <option :value="512">512 (SD 1.5)</option>
                  <option :value="768">768 (SD 2.x)</option>
                  <option :value="1024">1024 (SDXL / Flux)</option>
                </select>
              </div>
              <size-picker v-model="cfg.providers.a1111.default_size" :presets="localSizes"></size-picker>
            </div>
          </div>

          <!-- ComfyUI -->
          <div v-if="tab === 'comfyui'" class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="field">ComfyUI URL</label>
              <input class="input font-mono" v-model.trim="cfg.providers.comfyui.base_url" placeholder="http://127.0.0.1:8188" spellcheck="false">
            </div>
            <div class="sm:col-span-2">
              <label class="field">Checkpoint</label>
              <div class="flex gap-2">
                <select class="input" v-model="cfg.providers.comfyui.checkpoint">
                  <option value="">First available checkpoint</option>
                  <option v-for="c in checkpointOptions" :key="c" :value="c">{{ c }}</option>
                </select>
                <button type="button" class="btn-secondary shrink-0" @click="loadCheckpoints" :disabled="checkpointsLoading">
                  {{ checkpointsLoading ? 'Loading…' : 'Load list' }}
                </button>
              </div>
              <p class="hint" :class="checkpointsError ? 'text-red-600!' : ''" v-text="checkpointsError || checkpointHint"></p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">Workflow file</label>
              <input class="input font-mono" v-model.trim="cfg.providers.comfyui.workflow_path" spellcheck="false">
              <p class="hint">API-format workflow JSON, relative to the project folder. Placeholders: {{ placeholderList }}.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">Edit workflow file</label>
              <input class="input font-mono" v-model.trim="cfg.providers.comfyui.edit_workflow_path" spellcheck="false">
              <p class="hint">
                Used when Claude edits an existing image. Same placeholders, plus <span class="font-mono" v-pre>{{image}}</span>
                (the uploaded input image, for a LoadImage node) and <span class="font-mono" v-pre>{{denoise}}</span> (the edit strength).
              </p>
            </div>
            <div>
              <label class="field">Sampling steps: {{ cfg.providers.comfyui.steps }}</label>
              <input class="w-full accent-indigo-600" type="range" min="1" max="150" v-model.number="cfg.providers.comfyui.steps">
            </div>
            <div>
              <label class="field">CFG scale</label>
              <input class="input" type="number" min="1" max="30" step="0.5" v-model.number="cfg.providers.comfyui.cfg_scale">
            </div>
            <div class="sm:col-span-2">
              <label class="field">Default size</label>
              <div class="flex flex-wrap items-center gap-2 mb-2 text-xs text-zinc-500">
                <span>Base resolution</span>
                <select class="input w-auto! py-1! text-xs" v-model.number="localBase">
                  <option :value="512">512 (SD 1.5)</option>
                  <option :value="768">768 (SD 2.x)</option>
                  <option :value="1024">1024 (SDXL / Flux)</option>
                </select>
              </div>
              <size-picker v-model="cfg.providers.comfyui.default_size" :presets="localSizes"></size-picker>
            </div>
            <div>
              <label class="field">Timeout (seconds)</label>
              <input class="input" type="number" min="1" v-model.number="cfg.providers.comfyui.timeout">
            </div>
          </div>

          <!-- Unsloth Studio -->
          <div v-if="tab === 'unsloth'" class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="field">Unsloth Studio URL</label>
              <input class="input font-mono" v-model.trim="cfg.providers.unsloth.base_url" placeholder="http://127.0.0.1:8888" spellcheck="false">
              <p class="hint">
                Start Unsloth Desktop or <span class="font-mono">unsloth studio</span>, then load an image model (FLUX, Qwen-Image, Z-Image, SDXL…)
                in its Images tab. Images come from <span class="font-mono">/v1/images/generations</span> with whichever model is loaded there.
              </p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">API key</label>
              <div class="flex gap-2">
                <input class="input font-mono" :type="showKey ? 'text' : 'password'" v-model.trim="cfg.providers.unsloth.api_key"
                       placeholder="sk-unsloth-…" autocomplete="off" spellcheck="false" @focus="$event.target.select()">
                <button type="button" class="btn-secondary shrink-0" @click="showKey = !showKey">{{ showKey ? 'Hide' : 'Show' }}</button>
              </div>
              <p class="hint">Create one in Unsloth under your avatar → Settings → API; it is shown only once. Stored in config.json (file mode 600).</p>
            </div>
            <div>
              <label class="field">Sampling steps</label>
              <input class="input" type="number" min="1" max="100" placeholder="model default"
                     :value="cfg.providers.unsloth.steps" @input="cfg.providers.unsloth.steps = optionalNumber($event)">
              <p class="hint">Empty uses the loaded model's default.</p>
            </div>
            <div>
              <label class="field">Guidance</label>
              <input class="input" type="number" min="0" max="20" step="0.5" placeholder="model default"
                     :value="cfg.providers.unsloth.guidance" @input="cfg.providers.unsloth.guidance = optionalNumber($event)">
              <p class="hint">Empty uses the model's default; some models work best at 0.</p>
            </div>
            <div class="sm:col-span-2">
              <label class="field">Default size</label>
              <div class="flex flex-wrap items-center gap-2 mb-2 text-xs text-zinc-500">
                <span>Base resolution</span>
                <select class="input w-auto! py-1! text-xs" v-model.number="localBase">
                  <option :value="512">512 (SD 1.5)</option>
                  <option :value="768">768 (SD 2.x)</option>
                  <option :value="1024">1024 (SDXL / Flux)</option>
                </select>
              </div>
              <size-picker v-model="cfg.providers.unsloth.default_size" :presets="localSizes"></size-picker>
            </div>
            <div>
              <label class="field">Timeout (seconds)</label>
              <input class="input" type="number" min="1" v-model.number="cfg.providers.unsloth.timeout">
            </div>
          </div>

          <!-- Output -->
          <div v-if="tab === 'output'" class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label class="field">Output folder</label>
              <input class="input font-mono" v-model.trim="cfg.output.dir" placeholder="." spellcheck="false">
              <p class="hint">
                Relative paths are inside the folder Claude Code is working in: <span class="font-mono">.</span> saves into that folder itself,
                <span class="font-mono">images</span> into a subfolder of it. Use an absolute path to always save to one place.
                Claude can also choose a folder and file name per request.
              </p>
            </div>
            <div class="sm:col-span-2">
              <label class="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" class="mt-1 h-4 w-4 accent-indigo-600" v-model="cfg.output.return_inline">
                <span>
                  <span class="block text-sm font-medium">Return images inline</span>
                  <span class="hint block">Sends a preview to Claude with the file path so it can see the result. Turn off to return paths only and save context.</span>
                </span>
              </label>
            </div>
            <div>
              <label class="field">Inline preview max edge (px)</label>
              <input class="input" type="number" min="128" max="4096" step="64" v-model.number="cfg.output.inline_max_px" :disabled="!cfg.output.return_inline">
            </div>
          </div>

          <!-- Test -->
          <div v-if="tab !== 'output'" class="mt-6 flex flex-wrap items-center gap-3 border-t border-zinc-200 dark:border-zinc-800 pt-5">
            <button type="button" class="btn-secondary" @click="testProvider(tab)" :disabled="testing">
              {{ testing ? 'Testing…' : 'Test connection' }}
            </button>
            <span v-if="testResult[tab]" class="flex items-center gap-2 text-sm min-w-0">
              <span :class="['h-2 w-2 shrink-0 rounded-full', dotClass(testResult[tab])]"></span>
              <span :class="testResult[tab].ok ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'" class="break-words">
                {{ statusText(testResult[tab]) }}
              </span>
            </span>
          </div>
        </div>
      </section>

      <!-- Claude Code -->
      <section class="panel p-5 sm:p-6">
        <h2 class="font-medium mb-1">Connect to Claude Code</h2>
        <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-3">Run once in a terminal, then start a new Claude Code session. Claude Code starts the server over stdio and picks up changes made here on the next call.</p>
        <div class="flex gap-2">
          <code class="input font-mono text-xs overflow-x-auto whitespace-nowrap">{{ meta.claude_command }}</code>
          <button type="button" class="btn-secondary shrink-0" @click="copy(meta.claude_command)">{{ copied ? 'Copied' : 'Copy' }}</button>
        </div>
        <p class="hint mt-3">
          Got <span class="font-mono">already exists</span>? Remove the old entry first with <span class="font-mono">claude mcp remove imgswitch</span>
          (run it in the folder where you first added it), then run the command above. Check with <span class="font-mono">claude mcp get imgswitch</span>.
        </p>
        <p class="hint mt-2">Config file: <span class="font-mono break-all">{{ meta.config_path }}</span></p>
      </section>
    </template>
  </div>
</script>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, nextTick } = Vue;

const PROVIDERS = [
  { id: 'openai', name: 'OpenAI-compatible', group: 'cloud' },
  { id: 'a1111', name: 'Stable Diffusion WebUI', group: 'local' },
  { id: 'comfyui', name: 'ComfyUI', group: 'local' },
  { id: 'unsloth', name: 'Unsloth Studio', group: 'local' },
];
// Sizes each OpenAI model family accepts.
const OPENAI_SIZES = {
  'dall-e-2': ['256x256', '512x512', '1024x1024'],
  'dall-e-3': ['1024x1024', '1792x1024', '1024x1792'],
  'gpt-image': ['1024x1024', '1536x1024', '1024x1536'],
};
// Shown until the account's real model list has loaded.
const FALLBACK_MODELS = ['dall-e-2', 'dall-e-3', 'gpt-image-1'];
function modelFamily(model) {
  if (/gpt-image|chatgpt-image/i.test(model)) return 'gpt-image';
  if (/dall-e-3/i.test(model)) return 'dall-e-3';
  if (/dall-e-2/i.test(model)) return 'dall-e-2';
  return null;
}
const RATIOS = [['1:1', 1, 1], ['4:3', 4, 3], ['3:4', 3, 4], ['3:2', 3, 2], ['2:3', 2, 3], ['16:9', 16, 9], ['9:16', 9, 16]];

async function api(path, options = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = body.detail;
    throw new Error(Array.isArray(d) ? d.map(e => `${e.loc.filter(x => x !== 'body').join('.')}: ${e.msg}`).join('; ') : (d || r.statusText));
  }
  return body;
}

const SizePicker = {
  template: '#size-picker',
  props: { modelValue: String, presets: Array },
  emits: ['update:modelValue'],
};

createApp({
  template: '#app-tpl',
  components: { SizePicker },
  setup() {
    const cfg = ref(null);
    const meta = ref({});
    const status = reactive({});
    const testResult = reactive({});
    const tab = ref('openai');
    const loadError = ref('');
    const saveState = ref('idle');
    const saveError = ref('');
    const showKey = ref(false);
    const testing = ref(false);
    const copied = ref(false);
    const localBase = ref(1024);
    const checkpoints = ref([]);
    const checkpointsLoading = ref(false);
    const checkpointsError = ref('');
    let saveTimer, loaded = false;

    const groups = [
      { label: 'Cloud API', items: PROVIDERS.filter(p => p.group === 'cloud'), span: '', cols: '' },
      { label: 'Local deployment', items: PROVIDERS.filter(p => p.group === 'local'), span: 'md:col-span-3', cols: 'sm:grid-cols-3' },
    ];
    const tabs = [...PROVIDERS, { id: 'output', name: 'Output' }];
    const openaiModel = computed(() => cfg.value?.providers.openai.model || '');
    const isGptImage = computed(() => modelFamily(openaiModel.value) === 'gpt-image');
    const openaiSizes = computed(() => {
      const family = modelFamily(openaiModel.value);
      const sizes = family ? OPENAI_SIZES[family] : [...new Set(Object.values(OPENAI_SIZES).flat())];
      return sizes.map(s => ({ label: s.replace('x', '×'), value: s }));
    });
    // A size the newly chosen model doesn't support would make every call fail.
    watch(openaiModel, m => {
      const family = modelFamily(m);
      if (family && !OPENAI_SIZES[family].includes(cfg.value.providers.openai.default_size)) {
        cfg.value.providers.openai.default_size = '1024x1024';
      }
    });

    const openaiModels = ref(null);  // {image: [...], other: [...]} once loaded
    const modelsLoading = ref(false);
    const modelsError = ref('');
    const customModel = ref(false);
    let modelsTimer, modelsLoadedFor = '';
    const modelOptions = computed(() => {
      const loaded = openaiModels.value;
      const list = !loaded ? FALLBACK_MODELS : loaded.image.length ? loaded.image : loaded.other;
      const current = openaiModel.value;
      return current && !list.includes(current) ? [current, ...list] : list;
    });
    const modelChoice = computed({
      get: () => (customModel.value ? '__custom__' : openaiModel.value),
      set: v => {
        customModel.value = v === '__custom__';
        if (!customModel.value) cfg.value.providers.openai.model = v;
      },
    });
    const modelsHint = computed(() => {
      if (modelsLoading.value) return 'Loading models from your account…';
      if (modelsError.value) return modelsError.value;
      const loaded = openaiModels.value;
      if (!loaded) return cfg.value?.providers.openai.api_key
        ? 'Click Refresh to load the models available to this key.'
        : 'Enter an API key to load the models available to your account.';
      if (loaded.image.length) return `${loaded.image.length} image model(s) available with this key.`;
      return `No image models recognised by name, so all ${loaded.other.length} models are listed.`;
    });

    async function loadOpenAIModels() {
      const form = cfg.value.providers.openai;
      modelsLoading.value = true;
      modelsError.value = '';
      try {
        openaiModels.value = await api('/api/openai/models', { method: 'POST', body: JSON.stringify(form) });
        modelsLoadedFor = form.base_url + '\n' + form.api_key;
      } catch (e) {
        modelsError.value = `Could not load models: ${e.message}`;
      } finally {
        modelsLoading.value = false;
      }
    }

    // Load automatically when the OpenAI tab is shown or the key / base URL changes.
    watch(() => [tab.value, cfg.value?.providers.openai.base_url, cfg.value?.providers.openai.api_key], ([t, base, key]) => {
      clearTimeout(modelsTimer);
      if (t !== 'openai' || !key || modelsLoadedFor === base + '\n' + key) return;
      modelsTimer = setTimeout(loadOpenAIModels, 600);
    });
    const localSizes = computed(() => RATIOS.map(([label, a, b]) => {
      const r = Math.sqrt(a / b), w = Math.round(localBase.value * r / 64) * 64, h = Math.round(localBase.value / r / 64) * 64;
      return { label: `${label} · ${w}×${h}`, value: `${w}x${h}` };
    }));
    const samplers = ['Euler a', 'Euler', 'DPM++ 2M', 'DPM++ 2M SDE', 'DPM++ SDE', 'DDIM', 'UniPC', 'LMS', 'Heun'];
    const placeholderList = ['prompt', 'negative_prompt', 'width', 'height', 'steps', 'cfg', 'seed', 'checkpoint', 'batch_size'].map(p => `{{${p}}}`).join(' ');
    const checkpointHint = 'Fills the {{checkpoint}} placeholder in the workflow.';
    const checkpointOptions = computed(() => {
      const current = cfg.value?.providers.comfyui.checkpoint;
      return current && !checkpoints.value.includes(current) ? [current, ...checkpoints.value] : checkpoints.value;
    });

    async function refreshStatus() {
      if (document.visibilityState === 'hidden') return;  // don't ping cloud APIs from a background tab
      try { Object.assign(status, await api('/api/status')); } catch { /* server gone; keep last state */ }
    }

    async function save() {
      saveState.value = 'saving';
      try {
        await api('/api/config', { method: 'PUT', body: JSON.stringify(cfg.value) });
        saveState.value = 'saved';
        saveError.value = '';
        setTimeout(refreshStatus, 300);
      } catch (e) {
        saveState.value = 'error';
        saveError.value = e.message;
      }
    }

    watch(cfg, () => {
      if (!loaded) return;
      saveState.value = 'pending';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 500);
    }, { deep: true });

    function activate(id) {
      cfg.value.providers[id].enabled = true;  // the active backend must be available
      cfg.value.active_provider = id;
      tab.value = id;
    }

    async function testProvider(id) {
      testing.value = true;
      try {
        testResult[id] = await api(`/api/providers/${id}/test`, { method: 'POST', body: JSON.stringify(cfg.value.providers[id]) });
      } catch (e) {
        testResult[id] = { ok: false, detail: e.message };
      } finally {
        testing.value = false;
      }
    }

    async function loadCheckpoints() {
      checkpointsLoading.value = true;
      checkpointsError.value = '';
      try {
        checkpoints.value = await api('/api/comfyui/checkpoints', { method: 'POST', body: JSON.stringify(cfg.value.providers.comfyui) });
        if (!checkpoints.value.length) checkpointsError.value = 'ComfyUI reports no installed checkpoints.';
      } catch (e) {
        checkpointsError.value = e.message;
      } finally {
        checkpointsLoading.value = false;
      }
    }

    async function copy(text) {
      try {
        await navigator.clipboard.writeText(text);
        copied.value = true;
        setTimeout(() => (copied.value = false), 1500);
      } catch { /* clipboard unavailable */ }
    }

    // An emptied optional number field stores null ("use the default"), not '' which the config rejects.
    const optionalNumber = e => (e.target.value === '' ? null : Number(e.target.value));
    const dotClass = s => !s ? 'bg-zinc-300 dark:bg-zinc-600' : s.ok ? 'bg-emerald-500' : 'bg-red-500';
    const statusText = s => !s ? 'Checking…' : s.ok ? `${s.detail}${s.latency_ms != null ? ` · ${s.latency_ms} ms` : ''}` : s.detail;

    onMounted(async () => {
      try {
        [cfg.value, meta.value] = await Promise.all([api('/api/config'), api('/api/meta')]);
        tab.value = cfg.value.active_provider;
        await nextTick();
        loaded = true;
      } catch (e) {
        loadError.value = `Could not load configuration: ${e.message}`;
        return;
      }
      refreshStatus();
      setInterval(refreshStatus, 15000);
      document.addEventListener('visibilitychange', refreshStatus);
    });

    return {
      cfg, meta, status, testResult, tab, tabs, groups, loadError, saveState, saveError, showKey, testing, copied,
      openaiSizes, isGptImage, modelOptions, modelChoice, customModel, modelsHint, modelsError, modelsLoading, loadOpenAIModels,
      localSizes, localBase, samplers, placeholderList, checkpointHint, checkpointOptions, checkpointsLoading, checkpointsError,
      activate, testProvider, loadCheckpoints, copy, optionalNumber, dotClass, statusText,
    };
  },
}).mount('#app');
</script>
</body>
</html>
