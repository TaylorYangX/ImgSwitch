[project]
name = "imgswitch"
version = "0.1.0"
description = "Image generation MCP server with a local dashboard for switching between cloud and local backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",  # uses the v2 MCPServer API
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
